# Authelia for deepseek-harness-augmented: the login in front of dsh web,
# through the image's @louisremi/dsh-oidc-login plugin (README: "Optional:
# sign in with Authelia").
#
# One owner, email + password, a second factor required, no sign-up.
# Rendered by Authelia's template filter (X_AUTHELIA_CONFIG_FILTERS=template):
# the env function reads the non-secret DSH_AUTH_* / DSH_OIDC_* values of
# .env.authelia, the secret function reads the files that
# scripts/authelia-setup.sh generated. Nothing secret lives in this file.

server:
  address: 'tcp://:9091/'
  endpoints:
    # Rate limits on the sensitive endpoints. These are Authelia's defaults,
    # written out so they are visible and tunable.
    rate_limits:
      reset_password_start:
        enable: true
        buckets:
          - { period: '10 minutes', requests: 5 }
          - { period: '15 minutes', requests: 10 }
          - { period: '30 minutes', requests: 15 }
      reset_password_finish:
        enable: true
        buckets:
          - { period: '1 minute', requests: 10 }
          - { period: '2 minutes', requests: 15 }
      second_factor_totp:
        enable: true
        buckets:
          - { period: '1 minute', requests: 30 }
          - { period: '2 minutes', requests: 40 }
          - { period: '10 minutes', requests: 50 }
      session_elevation_start:
        enable: true
        buckets:
          - { period: '5 minutes', requests: 3 }
          - { period: '10 minutes', requests: 5 }
          - { period: '1 hour', requests: 15 }
      session_elevation_finish:
        enable: true
        buckets:
          - { period: '10 minutes', requests: 3 }
          - { period: '20 minutes', requests: 5 }
          - { period: '1 hour', requests: 15 }
      openid_connect_token:
        enable: true
        buckets:
          - { period: '1 minute', requests: 30 }
          - { period: '2 minutes', requests: 40 }
          - { period: '10 minutes', requests: 50 }
          - { period: '1 hour', requests: 100 }
      openid_connect_userinfo:
        enable: true
        buckets:
          - { period: '1 minute', requests: 30 }
          - { period: '2 minutes', requests: 40 }
          - { period: '10 minutes', requests: 50 }
          - { period: '1 hour', requests: 100 }

log:
  level: 'info'

theme: 'auto'

# The identity-validation e-mails (registering a second factor, resetting the
# password) are written to a file on the host instead of being sent: only
# someone with shell access to the server can read the codes. Swap for
# notifier.smtp to receive them by e-mail.
notifier:
  disable_startup_check: true
  filesystem:
    filename: '/data/notification.txt'

totp:
  issuer: '{{ env "DSH_AUTH_TOTP_ISSUER" | default "DSH" }}'
  algorithm: 'SHA1'
  digits: 6
  period: 30
  skew: 1

webauthn:
  enable_passkey_login: false
  display_name: 'DSH'
  attestation_conveyance_preference: 'indirect'
  timeout: '60s'
  selection_criteria:
    user_verification: 'preferred'
    discoverability: 'preferred'

authentication_backend:
  # Self-service password changes stay possible (behind the second factor),
  # but nobody can create an account: the users file is edited on the host.
  password_reset:
    disable: false
  file:
    path: '/config/users.yml'
    watch: false
    search:
      email: true # log in with the e-mail address
      case_insensitive: true
    password:
      algorithm: 'argon2'
      argon2:
        variant: 'argon2id'
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

# Applies to password changes and resets. The setup script enforces the same
# minimum length for the first password.
password_policy:
  zxcvbn:
    enabled: true
    min_score: 4

# Brute-force protection: 5 failed logins in 10 minutes ban both the client
# IP and the account for 12 hours. Lift a ban early with
#   authelia storage bans user revoke <username>   (or: ip revoke <address>)
regulation:
  modes:
    - 'ip'
    - 'user'
  max_retries: 5
  find_time: '10m'
  ban_time: '12h'

# Authelia only serves its portal and the OIDC provider here; it protects no
# other site through forward-auth, so every site is denied. (Authelia needs
# at least one rule when the default is deny.)
access_control:
  default_policy: 'deny'
  rules:
    - domain: '{{ mustEnv "DSH_AUTH_COOKIE_DOMAIN" }}'
      policy: 'deny'

session:
  secret: '{{ secret "/run/secrets/authelia_session_secret" }}'
  name: 'authelia_session'
  same_site: 'lax'
  expiration: '1h'
  inactivity: '15m'
  remember_me: -1
  cookies:
    - domain: '{{ mustEnv "DSH_AUTH_COOKIE_DOMAIN" }}'
      authelia_url: '{{ mustEnv "DSH_AUTH_PUBLIC_URL" }}'

storage:
  encryption_key: '{{ secret "/run/secrets/authelia_storage_encryption_key" }}'
  local:
    path: '/data/db.sqlite3'

identity_validation:
  reset_password:
    jwt_secret: '{{ secret "/run/secrets/authelia_reset_password_jwt_secret" }}'
  elevated_session:
    require_second_factor: true

identity_providers:
  oidc:
    hmac_secret: '{{ secret "/run/secrets/authelia_oidc_hmac_secret" }}'
    jwks:
      - key_id: 'dsh-oidc'
        algorithm: 'RS256'
        use: 'sig'
        key: {{ secret "/run/secrets/authelia_oidc_jwk.pem" | mindent 10 "|" | msquote }}
    enforce_pkce: 'always'
    enable_pkce_plain_challenge: false
    lifespans:
      authorize_code: '1m'
      access_token: '5m'
      id_token: '5m'
    authorization_policies:
      dsh_owner:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject: 'user:{{ mustEnv "DSH_AUTH_OWNER" }}'
    clients:
      - client_id: 'dsh'
        client_name: 'DeepSeek Harness'
        client_secret: '{{ secret "/run/secrets/dsh_oidc_client_secret.digest" }}'
        public: false
        redirect_uris:
          - '{{ mustEnv "DSH_OIDC_PUBLIC_URL" }}/auth/callback'
        scopes:
          - 'openid'
          - 'email'
          - 'profile'
        grant_types:
          - 'authorization_code'
        response_types:
          - 'code'
        response_modes:
          - 'query'
        require_pkce: true
        pkce_challenge_method: 'S256'
        token_endpoint_auth_method: 'client_secret_basic'
        consent_mode: 'implicit'
        authorization_policy: 'dsh_owner'
