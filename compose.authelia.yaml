# Optional overlay: sign in to dsh web with Authelia (email + password + a
# required second factor) instead of the launch-token link, which keeps
# working. README: "Optional: sign in with Authelia".
#
#   scripts/authelia-setup.sh ./authelia          # secrets + the single owner
#   cp .env.authelia.example .env && $EDITOR .env
#   docker compose -f compose.yaml -f compose.authelia.yaml up -d
#
# Authelia must be reachable over HTTPS at DSH_AUTH_PUBLIC_URL by your
# browser *and* by the dsh container (which fetches its OIDC discovery,
# tokens and keys). This overlay publishes it on host loopback only; put your
# TLS reverse proxy (Caddy, Traefik, tsdproxy, ...) in front of it, exactly
# as for dsh itself.
services:
  authelia:
    image: docker.io/authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
    user: "${DSH_AUTH_UID:-1000}:${DSH_AUTH_GID:-1000}"
    command: ["authelia", "--config", "/config/configuration.yml"]
    ports:
      - "127.0.0.1:${DSH_AUTH_PORT:-9091}:9091"
    environment:
      X_AUTHELIA_CONFIG_FILTERS: template
      TZ: ${TZ:-UTC}
      DSH_AUTH_PUBLIC_URL: ${DSH_AUTH_PUBLIC_URL:?set DSH_AUTH_PUBLIC_URL}
      DSH_AUTH_COOKIE_DOMAIN: ${DSH_AUTH_COOKIE_DOMAIN:?set DSH_AUTH_COOKIE_DOMAIN}
      DSH_AUTH_OWNER: ${DSH_AUTH_OWNER:?set DSH_AUTH_OWNER}
      DSH_OIDC_PUBLIC_URL: ${DSH_OIDC_PUBLIC_URL:?set DSH_OIDC_PUBLIC_URL}
    volumes:
      # rw, not ro: a password reset rewrites config/users.yml.
      - ${DSH_AUTH_DIR:-./authelia}/config:/config
      # Must be a real filesystem, not Unraid's /mnt/user (shfs/FUSE), where
      # Authelia's SQLite store fails its startup check: use /mnt/cache/appdata
      # on Unraid. config/ and secrets/ are fine on the shfs share.
      - ${DSH_AUTH_DATA_DIR:-${DSH_AUTH_DIR:-./authelia}/data}:/data
    secrets:
      - authelia_session_secret
      - authelia_storage_encryption_key
      - authelia_oidc_hmac_secret
      - authelia_reset_password_jwt_secret
      - authelia_oidc_jwk.pem
      - dsh_oidc_client_secret.digest
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--no-check-certificate", "http://127.0.0.1:9091/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3

  deepseek-harness:
    environment:
      DSH_OIDC_ISSUER: ${DSH_AUTH_PUBLIC_URL:?set DSH_AUTH_PUBLIC_URL}
      DSH_OIDC_CLIENT_ID: dsh
      DSH_OIDC_CLIENT_SECRET_FILE: /run/secrets/dsh_oidc_client_secret
      DSH_OIDC_PUBLIC_URL: ${DSH_OIDC_PUBLIC_URL:?set DSH_OIDC_PUBLIC_URL}
      DSH_OIDC_ALLOWED_EMAILS: ${DSH_OIDC_ALLOWED_EMAILS:?set DSH_OIDC_ALLOWED_EMAILS}
    secrets:
      - dsh_oidc_client_secret
    depends_on:
      authelia:
        condition: service_healthy

secrets:
  authelia_session_secret:
    file: ${DSH_AUTH_DIR:-./authelia}/secrets/authelia_session_secret
  authelia_storage_encryption_key:
    file: ${DSH_AUTH_DIR:-./authelia}/secrets/authelia_storage_encryption_key
  authelia_oidc_hmac_secret:
    file: ${DSH_AUTH_DIR:-./authelia}/secrets/authelia_oidc_hmac_secret
  authelia_reset_password_jwt_secret:
    file: ${DSH_AUTH_DIR:-./authelia}/secrets/authelia_reset_password_jwt_secret
  authelia_oidc_jwk.pem:
    file: ${DSH_AUTH_DIR:-./authelia}/secrets/authelia_oidc_jwk.pem
  dsh_oidc_client_secret.digest:
    file: ${DSH_AUTH_DIR:-./authelia}/secrets/dsh_oidc_client_secret.digest
  dsh_oidc_client_secret:
    file: ${DSH_AUTH_DIR:-./authelia}/secrets/dsh_oidc_client_secret
