# How maintainer-agent (https://github.com/louisremi/maintainer-agent)
# behaves in this repository. Validated strictly by the agent; protected (the
# agent never modifies it).
version: 2

instructions: [AGENTS.md]

# Repository playbooks, overriding the generic ones shipped with the agent.
# v1 `triage` is now `issue`; v1 `ci-fix` has no v2 equivalent (CI fixes
# arrive as `agent-fix` issues and use the implement playbook).
playbooks:
  issue: docs/agent/triage.md
  implement: docs/agent/implement-issue.md

checks:
  - scripts/static-check.sh --online

# Hosts the fix agent needs for `static-check.sh --online` and
# `refresh-checksums.py` (GitHub is always allowed).
egress:
  - registry.npmjs.org
  - pypi.org
  - files.pythonhosted.org
  - hub.docker.com
  - registry-1.docker.io
  - auth.docker.io

links:
  - https://hub.docker.com/r/louisremi/deepseek-harness-augmented
  - https://github.com/runzhliu/deepseek-harness-docker

protected_paths:
  - scripts/smoke.sh

answer:
  enabled: true
  max_attempts: 2

fix:
  enabled: true
  max_attempts: 2
  step_limit: 80
