# How maintainer-agent (https://github.com/louisremi/maintainer-agent)
# behaves in this repository. Validated strictly by the agent; protected (the
# agent never modifies it).
version: 1

instructions: [AGENTS.md]

playbooks:
  triage: docs/agent/triage.md
  implement: docs/agent/implement-issue.md
  ci-fix: docs/agent/fix-ci-failure.md

checks:
  - scripts/static-check.sh --online

# Hosts the fix-mode agent needs for `static-check.sh --online` and
# `refresh-checksums.py` (GitHub is always allowed).
egress:
  - registry.npmjs.org
  - pypi.org
  - files.pythonhosted.org
  - hub.docker.com
  - registry-1.docker.io
  - auth.docker.io
  - cursor.com
  - downloads.cursor.com

links:
  - https://hub.docker.com/r/louisremi/deepseek-harness-dev
  - https://github.com/runzhliu/deepseek-harness-docker

protected_paths:
  - scripts/smoke.sh

bot_branches: [renovate/*]
bot_authors: ["29139614+renovate[bot]@users.noreply.github.com"]

triage:
  enabled: true
  max_age_days: 14
  max_attempts: 2

fix:
  enabled: true
  max_attempts: 2
  step_limit: 80
