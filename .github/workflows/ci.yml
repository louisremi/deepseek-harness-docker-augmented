name: CI

# validate -> build+smoke (3 variants x amd64/arm64, native runners) -> images -> publish
#
# Variants (scripts/tag-scheme.sh): default, bwrap, ungoogled, each FROM the
# matching upstream image. PRs (Renovate bumps, agent fixes): build and smoke
# all six, push nothing. Branch protection requires `review-gate / gate`,
# `validate` and `images` (the aggregate of the build matrix); GitHub
# auto-merges green Renovate PRs, but anything maintainer-agent may have
# touched waits for a human at `review-gate` (see the job below).
#
# Publishing pushes each variant/architecture by digest, then per variant a
# multi-arch manifest under its immutable tag (`release-plan.sh variant-tags`)
# and its moving tag (latest / bwrap / ungoogled). One GitHub Release, named
# after the default variant's tag <X-rN>-augmented.<N>, covers all three. It
# happens only when `validate` decides so (scripts/release-plan.sh):
#   - push to main that changed an upstream base image pin (tag or digest)
#     since the latest GitHub release -> publish, then create that release
#     (generated notes);
#   - weekly schedule / manual dispatch on main -> same, but only if some
#     variant's /opt/devtools/MANIFEST.txt differs from its moving tag (e.g.
#     Debian security updates; tool bumps merged meanwhile ship too), so no
#     empty tags appear; a dispatch with `force_publish` skips that comparison;
#   - a GitHub Release created by hand (tag = the next <X-rN>-augmented.<N>,
#     commit on main) -> publish that N. Releases created by this workflow's
#     GITHUB_TOKEN do not trigger the release event, so there is no loop.
# Push, schedule and dispatch runs publish only the tip of main, so re-running
# an old run cannot republish an old commit; a hand-made release on an older
# commit of main gets its own tags but does not move the moving tags.
# Any other push to main (tool, npm, pip, action bumps) builds and smoke-tests
# only; cut a release when you want those to ship.
#
# Jobs always run (so required checks never hang on docs-only PRs); the image
# build is skipped when no file that ends up in the image changed.

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      force_publish:
        description: Publish even if the image manifest is unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: docker.io/louisremi/deepseek-harness-augmented

jobs:
  # Human-review gate from maintainer-agent (reusable workflow). Only a pure
  # Renovate bump skips review; anything the agent (or anyone else) wrote
  # waits for a maintainer to approve the `agent-review` environment.
  # Required check: `review-gate / gate`. See
  # https://github.com/louisremi/maintainer-agent#watching-a-repository
  review-gate:
    if: github.event_name == 'pull_request'
    uses: louisremi/maintainer-agent/.github/workflows/review-gate.yml@232fecaa8ebc196c28dbc637651fb2f24ff665c2 # v0.1.1
    with:
      bot_branches: "renovate/*"
      bot_authors: "29139614+renovate[bot]@users.noreply.github.com"
      bot_pr_author: ${{ vars.RENOVATE_PR_AUTHOR }}
      ci_workflow: ci.yml
    permissions:
      contents: read
      actions: read
      pull-requests: write

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image_changed: ${{ steps.changes.outputs.image_changed }}
      publish: ${{ steps.plan.outputs.publish }}
      latest: ${{ steps.plan.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did anything that goes into the image change?
        id: changes
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" && "${{ github.event_name }}" != "push" ]]; then
            echo "image_changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "image_changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "${base}" HEAD)"
          echo "${files}"
          if grep -Eq '^(Dockerfile|\.dockerignore|agents/|tools/|scripts/|\.github/workflows/ci\.yml)' <<<"${files}"; then
            echo "image_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "image_changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Should this run publish an image? Values from the event reach the
      # script through env only (a release tag name is user input).
      - name: Publish plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT}" == "release" ]]; then
            scripts/release-plan.sh validate-tag "${RELEASE_TAG}" HEAD
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::Release ${RELEASE_TAG} points at a commit that is not on main; only reviewed code may be published."
              exit 1
            fi
            scripts/release-plan.sh tag-free "${RELEASE_TAG}" "${IMAGE#docker.io/}"
          fi
          # Fails (instead of guessing) when the GitHub API is unavailable.
          scripts/release-plan.sh decide "${EVENT}" "${REF}" "${BEFORE}" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install hadolint
        run: |
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
          hadolint --version
      - name: Static checks (online)
        run: scripts/static-check.sh --online

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        variant: [default, bwrap, ungoogled]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: build (${{ matrix.variant }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      ENABLED: ${{ needs.validate.outputs.image_changed == 'true' || needs.validate.outputs.publish == 'true' }}
      PUBLISH: ${{ needs.validate.outputs.publish == 'true' }}
      LOCAL_TAG: deepseek-harness-augmented:ci-${{ matrix.variant }}
    steps:
      - name: Skip (no image inputs changed)
        if: env.ENABLED != 'true'
        run: echo "No Dockerfile/agents/tools/scripts change; image build skipped."

      - uses: actions/checkout@v7
        if: env.ENABLED == 'true'

      # Ubuntu 24.04 runners restrict unprivileged user namespaces through
      # AppArmor (host sysctl), and Docker's docker-default AppArmor profile
      # forbids bwrap's mounts ("Failed to make / slave"), so smoke.sh also
      # passes apparmor=unconfined for the bwrap variant.
      - name: Allow unprivileged user namespaces (bwrap smoke test)
        if: env.ENABLED == 'true' && matrix.variant == 'bwrap'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: docker/setup-buildx-action@v4
        if: env.ENABLED == 'true'

      # Authenticated pulls avoid Docker Hub rate limits. Secrets are not
      # available to fork PRs; the build still works anonymously there.
      - name: Log in to Docker Hub
        if: env.ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (load for smoke test)
        if: env.ENABLED == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          pull: true
          tags: ${{ env.LOCAL_TAG }}
          build-args: |
            VARIANT=${{ matrix.variant }}
            IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }},mode=max

      - name: Smoke test
        if: env.ENABLED == 'true'
        run: scripts/smoke.sh "${LOCAL_TAG}" "${{ matrix.variant }}"

      - name: Extract image manifest
        if: env.ENABLED == 'true'
        run: |
          mkdir -p out
          docker run --rm --entrypoint cat "${LOCAL_TAG}" /opt/devtools/MANIFEST.txt \
            > "out/manifest-${{ matrix.variant }}-${{ matrix.arch }}.txt"

      - name: Push by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VARIANT=${{ matrix.variant }}
            IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Record digest
        if: env.PUBLISH == 'true'
        run: echo "${{ steps.push.outputs.digest }}" > "out/digest-${{ matrix.variant }}-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v7
        if: env.ENABLED == 'true'
        with:
          name: build-${{ matrix.variant }}-${{ matrix.arch }}
          path: out/
          retention-days: 7

  # The one required build check: green only if every matrix leg succeeded
  # (or was skipped as a whole because no image input changed).
  images:
    needs: [validate, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All variants built and smoke-tested
        env:
          VALIDATE: ${{ needs.validate.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "validate=${VALIDATE} build=${BUILD}"
          [[ "${VALIDATE}" == success && "${BUILD}" == success ]]

  publish:
    needs: [validate, images]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub Release after the images are pushed
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: artifacts
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Decide whether to publish
        id: decide
        run: |
          set -euo pipefail
          # Push (upstream pin changed) and release (maintainer decision) are
          # already decided by `validate`. Schedule and dispatch publish only if
          # some variant's image inventory changed, unless a dispatch forces it.
          if [[ "${{ github.event_name }}" == "push" || "${{ github.event_name }}" == "release" || "${{ inputs.force_publish }}" == "true" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # shellcheck source=scripts/tag-scheme.sh
          . scripts/tag-scheme.sh
          changed=false
          for variant in "${VARIANTS[@]}"; do
            moving="${MOVING_TAGS[${variant}]}"
            for arch in amd64 arm64; do
              key="${variant}-${arch}"
              if ! docker run --rm --platform "linux/${arch}" --entrypoint cat "${IMAGE}:${moving}" \
                  /opt/devtools/MANIFEST.txt > "current-${key}.txt" 2>/dev/null; then
                echo "No published ${IMAGE}:${moving} (${arch}) to compare with."
                changed=true; continue
              fi
              if ! diff -u "current-${key}.txt" "artifacts/manifest-${key}.txt" > "diff-${key}.txt"; then
                changed=true
                echo "::group::manifest diff (${key})"; cat "diff-${key}.txt"; echo "::endgroup::"
              fi
            done
          done
          echo "publish=${changed}" >> "$GITHUB_OUTPUT"
          [[ "${changed}" == true ]] || echo "Image contents unchanged since the moving tags; skipping publish." >> "$GITHUB_STEP_SUMMARY"

      - name: Create and push multi-arch tags
        id: tags
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          LATEST: ${{ needs.validate.outputs.latest }}
        run: |
          set -euo pipefail
          repo="${IMAGE#docker.io/}"
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag="${RELEASE_TAG}" # format and branch validated in `validate`
          else
            tag="$(scripts/next-tag.sh "${repo}")"
            # The release is created last under the same name: make sure it is free now.
            scripts/release-plan.sh release-free "${tag}"
          fi
          # `validate` may have run up to ~90 min ago (builds); `imagetools create`
          # overwrites silently, so check again inside the publish concurrency group.
          scripts/release-plan.sh tag-free "${tag}" "${repo}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          {
            echo "### Published \`${tag}\`"
            echo
            echo "| Variant | Image | Moving tag |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          : > images.md
          while read -r variant vtag moving; do
            tags=(--tag "${IMAGE}:${vtag}")
            [[ "${LATEST}" != true ]] || tags+=(--tag "${IMAGE}:${moving}")
            echo "Publishing ${IMAGE}:${vtag}$([[ "${LATEST}" != true ]] || echo " and :${moving}")"
            docker buildx imagetools create "${tags[@]}" \
              "${IMAGE}@$(cat "artifacts/digest-${variant}-amd64")" \
              "${IMAGE}@$(cat "artifacts/digest-${variant}-arm64")"
            docker buildx imagetools inspect "${IMAGE}:${vtag}"
            mt="$([[ "${LATEST}" == true ]] && echo "\`${moving}\`" || echo "not moved")"
            echo "| ${variant} | \`${IMAGE}:${vtag}\` | ${mt} |" >> "$GITHUB_STEP_SUMMARY"
            echo "- **${variant}**: \`${IMAGE}:${vtag}\` (${mt})" >> images.md
          done < <(scripts/release-plan.sh variant-tags "${tag}")
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Platforms: linux/amd64, linux/arm64." >> "$GITHUB_STEP_SUMMARY"

      # Automatic publishes (upstream bump, weekly, dispatch) get a release
      # named after the default variant's tag. Created last, after the name was
      # checked to be free (`release-free`), so a failure here leaves images
      # without a release. (A release made by hand does the reverse when a guard
      # fails: the release exists, the images do not; delete it and retry.)
      # One made with GITHUB_TOKEN never triggers this workflow again.
      - name: Create the GitHub Release (generated notes)
        if: steps.decide.outputs.publish == 'true' && github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tags.outputs.tag }}
        run: |
          set -euo pipefail
          prev="$(scripts/release-plan.sh last-release)"
          { echo "Images (linux/amd64 and linux/arm64):"; echo; cat images.md; } > notes.md
          args=(--target "${GITHUB_SHA}" --title "${TAG}" --generate-notes --notes-file notes.md)
          # An explicit start tag: GitHub's automatic "previous tag" is unreliable for non-semver tags.
          [[ -z "${prev}" ]] || args+=(--notes-start-tag "${prev}")
          gh release create "${TAG}" "${args[@]}"
          echo "Release \`${TAG}\` created." >> "$GITHUB_STEP_SUMMARY"

      # A hand-made release keeps the notes the maintainer wrote; append the image list.
      - name: Add the image list to the hand-made release
        if: steps.decide.outputs.publish == 'true' && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tags.outputs.tag }}
        run: |
          set -euo pipefail
          { gh release view "${TAG}" --json body --jq .body; echo; echo "Images (linux/amd64 and linux/arm64):"; echo; cat images.md; } > notes.md
          gh release edit "${TAG}" --notes-file notes.md
